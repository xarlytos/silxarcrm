# ============================================================================
# HTTPS/TLS Hardening - Nginx Configuration
# ============================================================================
# Production-grade Nginx configuration with:
# - TLS 1.3 enforcement
# - HSTS headers (max-age 31536000 seconds = 1 year)
# - Security headers (X-Frame-Options, X-Content-Type-Options, CSP)
# - Certificate pinning for external APIs
# - Rate limiting (100 req/min per IP)
# - SSL/TLS optimization
# ============================================================================

# Upstream backend service
upstream crm_maestro_backend {
  server backend:5000;
  keepalive 32;
}

# Rate limiting configuration - 100 requests per minute per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# Redirect HTTP to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Allow Let's Encrypt ACME challenges
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect all other traffic to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS Server Configuration
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.ervok.com crmpropio.example.com;

  # ========================================================================
  # SSL/TLS Configuration
  # ========================================================================

  # Path to your SSL certificates
  # For production, use certificates from Let's Encrypt or your CA
  ssl_certificate /etc/nginx/ssl/cert.pem;
  ssl_certificate_key /etc/nginx/ssl/key.pem;

  # Intermediate certificate chain (if using Let's Encrypt)
  ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

  # ========================================================================
  # TLS 1.3 ENFORCEMENT
  # ========================================================================
  # Only allow TLS 1.3 (modern clients only)
  # For broader compatibility, use: TLSv1.3 TLSv1.2
  ssl_protocols TLSv1.3;

  # TLS 1.3 cipher suites (nginx with TLS 1.3 support)
  # TLS 1.3 auto-negotiates ciphers, but we can restrict to stronger ones
  ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

  # Prefer server ciphers (especially important for forward secrecy)
  ssl_prefer_server_ciphers on;

  # ECDH parameters for forward secrecy
  ssl_ecdh_curve X25519:P-256:P-384;

  # Session configuration
  ssl_session_cache shared:SSL:50m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # ========================================================================
  # HSTS - Strict Transport Security Header
  # ========================================================================
  # Force HTTPS for 1 year (31536000 seconds)
  # includeSubDomains: Apply to all subdomains
  # preload: Allow inclusion in browser HSTS preload lists
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # ========================================================================
  # Security Headers
  # ========================================================================

  # X-Frame-Options: Prevent clickjacking
  # DENY: Page cannot be displayed in a frame
  add_header X-Frame-Options "DENY" always;

  # X-Content-Type-Options: Prevent MIME-type sniffing
  # nosniff: Browser must respect the Content-Type header
  add_header X-Content-Type-Options "nosniff" always;

  # X-XSS-Protection: Enable XSS filter in browsers (legacy support)
  add_header X-XSS-Protection "1; mode=block" always;

  # Referrer-Policy: Control what referrer information is sent
  # strict-origin-when-cross-origin: Send only domain when cross-origin
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Permissions-Policy: Restrict powerful browser features
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # ========================================================================
  # Content Security Policy (CSP)
  # ========================================================================
  # Comprehensive CSP to prevent XSS, inject attacks, and unauthorized resource loading
  add_header Content-Security-Policy "
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    font-src 'self' data:;
    connect-src 'self' https://api.openai.com https://api.google.com https://generativelanguage.googleapis.com https://api.elevenlabs.io wss: https:;
    frame-ancestors 'none';
    form-action 'self';
    base-uri 'self';
    upgrade-insecure-requests;
  " always;

  # ========================================================================
  # Certificate Pinning Configuration
  # ========================================================================
  # Public-Key-Pins (HPKP): Pins certificates for external API endpoints
  # Backup pins required - if primary fails, backup takes over
  #
  # Generate pins with:
  # openssl s_client -connect api.elevenlabs.io:443 | openssl x509 -noout -pubkey | \
  #   openssl pkey -pubin -outform DER | openssl dgst -sha256 -binary | openssl enc -base64
  #
  # NOTE: Use with caution! Misconfiguration can make your site inaccessible
  # Recommend: Start with max-age=60 for testing, then increase to 2592000 (30 days)

  # For ElevenLabs API (TTS service)
  add_header Public-Key-Pins 'pin-sha256="9Z6xpKTlP4PeFnQBtKhgQ8qpH7OO9kAq5L1dF7wDhzA="; pin-sha256="abc123def456ghi789jkl012mno345pqr678stuv=="; max-age=60; includeSubDomains' always;

  # ========================================================================
  # Additional Security Headers
  # ========================================================================

  # Disable client caching for sensitive responses
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  add_header Pragma "no-cache" always;
  add_header Expires "0" always;

  # Inform browser not to cache sensitive pages
  add_header X-Content-Type-Options "nosniff" always;

  # ========================================================================
  # Rate Limiting
  # ========================================================================

  # General API rate limit: 100 requests per minute per IP
  limit_req zone=api_limit burst=20 nodelay;
  limit_req_status 429;

  # ========================================================================
  # Root Location
  # ========================================================================

  root /var/www/html;
  index index.html index.htm;

  # Health check endpoint (no rate limit)
  location = /health {
    access_log off;
    proxy_pass http://crm_maestro_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ========================================================================
  # Webhook Endpoints (bypass rate limiting)
  # ========================================================================

  location /webhooks/ {
    limit_req off;
    proxy_pass http://crm_maestro_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # ========================================================================
  # Events WebSocket (bypass rate limiting)
  # ========================================================================

  location /events {
    limit_req off;
    proxy_pass http://crm_maestro_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
  }

  # ========================================================================
  # Authentication Endpoints (stricter rate limiting)
  # ========================================================================

  location /api/auth/ {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://crm_maestro_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ========================================================================
  # General API Routes
  # ========================================================================

  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://crm_maestro_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Port $server_port;

    # Timeout configuration
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # HTTP version for backend
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # ========================================================================
  # Static Files
  # ========================================================================

  location /uploads/ {
    alias /var/www/uploads/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # ========================================================================
  # Security: Deny Access to Sensitive Files
  # ========================================================================

  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  location ~ ~$ {
    deny all;
    access_log off;
    log_not_found off;
  }

  location ~ /\.(?:env|git|svn|hg|passwd|shadow)(?:$|/) {
    deny all;
    access_log off;
    log_not_found off;
  }

  # ========================================================================
  # Logging
  # ========================================================================

  access_log /var/log/nginx/api_access.log combined;
  error_log /var/log/nginx/api_error.log warn;
}

# ============================================================================
# HTTP/2 Server Push Optimization (Optional)
# ============================================================================
# Uncomment to enable HTTP/2 Server Push for critical resources

# http2_push_preload on;

# ============================================================================
# Gzip Compression
# ============================================================================

gzip on;
gzip_vary on;
gzip_min_length 1000;
gzip_types text/plain text/css text/xml text/javascript
           application/x-javascript application/xml+rss
           application/json application/javascript;
gzip_disable "msie6";

# ============================================================================
# Performance & Security Defaults
# ============================================================================

server_tokens off;
send_timeout 10s;
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 15s;
types_hash_max_size 2048;
client_max_body_size 20M;
