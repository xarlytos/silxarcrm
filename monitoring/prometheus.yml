global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'silxacrm-prod'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

# Load alert rules
rule_files:
  - '/monitoring/alert_rules.yml'

scrape_configs:
  # Backend API Service
  - job_name: 'api-service'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:3000']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__scheme__]
        target_label: scheme

  # Lead Scoring Service
  - job_name: 'lead-scoring-service'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:3001']
    metrics_path: '/metrics'

  # Revenue Intelligence Service
  - job_name: 'revenue-intelligence-service'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:3002']
    metrics_path: '/metrics'

  # Deal Pipeline Service
  - job_name: 'deal-pipeline-service'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:3003']
    metrics_path: '/metrics'

  # Kafka Metrics (via Burrow/JMX Exporter)
  - job_name: 'kafka-broker'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9092']

  # Kafka Consumer Lag
  - job_name: 'kafka-consumer-lag'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: '/kafka_consumer_lag'

  # Database (PostgreSQL Exporter)
  - job_name: 'postgres'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9187']

  # Redis
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:6379']

  # Node Exporter (Host Metrics)
  - job_name: 'node'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9100']
